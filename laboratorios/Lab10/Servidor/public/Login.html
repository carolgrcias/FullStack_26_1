<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/carros.css">
</head>
<body>
<div class="container">
  <h1>Login</h1>
  <form action="/login" method="post">
    <p>Login:</p>
    <input name="login" required>
    <p>Senha:</p>
    <input name="senha" type="password" required>
    <p><button type="submit">Entrar</button></p>
  </form>
  <p class="links"><a href="/cadastra">Criar conta</a> | <a href="/carros">Ver carros</a></p>
</div>
</body>
</html>
