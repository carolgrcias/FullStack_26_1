<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Canvas</title>

    <style>
        /* 2.1 - Cor do fundo da página */
        body {
            background-color: #e8f0fe;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;

            /* 2.2 - Centralização dos elementos da página */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #1a3d7c;
        }

        canvas {
            background-color: white;
            border: 1px solid black;
        }

        a {
            margin-top: 20px;
            color: #1a3d7c;
        }
    </style>
</head>
<body>

    <h1>Canvas</h1>

    <!-- 1.3 e 1.4 - Área de desenho com tamanho 300 x 300 -->
    <canvas id="meuCanvas" width="300" height="300"></canvas>

    <a href="projetos.html">Voltar para Projetos</a>

    <script>
        const canvas = document.getElementById("meuCanvas");
        const ctx = canvas.getContext("2d");

        /* ===================== FUNÇÕES ===================== */

        // Desenha UM quadrado preenchido.
        // (x, y) = canto superior esquerdo
        function desenhar_quadrado(x, y, tamanho, cor) {
            ctx.beginPath();
            ctx.fillStyle = cor;
            ctx.fillRect(x, y, tamanho, tamanho);
            ctx.closePath();
        }

        // Desenha UMA linha do ponto (x1, y1) até o ponto (x2, y2).
        function desenhar_linha(x1, y1, x2, y2, cor) {
            ctx.beginPath();
            ctx.strokeStyle = cor;
            ctx.lineWidth = 1;
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.closePath();
        }

        // Desenha UM arco com centro em (x, y).
        // inicio e fim são ângulos em radianos (ex.: Math.PI, 2 * Math.PI).
        // corPreenchimento é opcional: se for informada, o arco é preenchido.
        function desenhar_arco(x, y, raio, inicio, fim, corBorda, corPreenchimento) {
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.arc(x, y, raio, inicio, fim);
            if (corPreenchimento) {
                ctx.fillStyle = corPreenchimento;
                ctx.fill();
            }
            ctx.strokeStyle = corBorda;
            ctx.stroke();
            ctx.closePath();
        }

        // Escreve UM texto com a base na posição (x, y), centralizado em x.
        function escrever(texto, x, y, cor) {
            ctx.beginPath();
            ctx.fillStyle = cor;
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText(texto, x, y);
            ctx.closePath();
        }

        /* ===================== DESENHO ===================== */

        const PI = Math.PI;

        // --- Quadrados ---
        desenhar_quadrado(0, 0, 50, "blue");       // canto superior esquerdo
        desenhar_quadrado(250, 0, 50, "red");      // canto superior direito

        desenhar_quadrado(0, 120, 30, "cyan");     // lateral esquerda (2 quadrados)
        desenhar_quadrado(0, 150, 30, "cyan");
        desenhar_quadrado(270, 135, 30, "cyan");   // lateral direita

        desenhar_quadrado(110, 150, 40, "red");    // centro

        desenhar_quadrado(0, 240, 30, "yellow");   // "escada" amarela (esquerda)
        desenhar_quadrado(0, 270, 30, "yellow");
        desenhar_quadrado(30, 270, 30, "yellow");

        desenhar_quadrado(270, 240, 30, "black");  // "escada" preta (direita)
        desenhar_quadrado(270, 270, 30, "black");
        desenhar_quadrado(240, 270, 30, "black");

        // --- Linhas ---
        desenhar_linha(50, 50, 150, 150, "blue");    // diagonal azul
        desenhar_linha(250, 50, 150, 150, "red");    // diagonal vermelha
        desenhar_linha(0, 150, 300, 150, "green");   // horizontal verde
        desenhar_linha(150, 150, 150, 260, "black"); // vertical preta

        // --- Arcos da parte de cima (centro 150, 150) ---
        desenhar_arco(150, 150, 60, PI, 2 * PI, "green");              // semicírculo interno
        desenhar_arco(150, 150, 80, PI, 1.25 * PI, "green");           // pedaço externo esquerdo
        desenhar_arco(150, 150, 80, 1.75 * PI, 2 * PI, "green");       // pedaço externo direito

        desenhar_arco(150, 115, 15, 0, 2 * PI, "blue", "cyan");        // círculo ciano

        // --- Círculos amarelos ---
        desenhar_arco(70, 220, 15, 0, 2 * PI, "green", "yellow");
        desenhar_arco(220, 220, 15, 0, 2 * PI, "green", "yellow");

        // --- Arcos da parte de baixo (centro 150, 300) ---
        desenhar_arco(150, 300, 80, PI, 1.5 * PI, "green");            // quarto de arco esquerdo
        desenhar_arco(150, 300, 60, 1.5 * PI, 2 * PI, "green");        // quarto de arco direito
        desenhar_arco(150, 300, 40, PI, 2 * PI, "green", "cyan");      // meia-lua ciano

        // --- Texto ---
        escrever("Canvas", 150, 50, "black");
    </script>

</body>
</html>
