<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Post</title>
    <link rel="stylesheet" href="/blog.css">
</head>
<body>
    <div class="container">
        <h1>Cadastrar Post</h1>

        <form action="/cadastrar_post" method="post">
            <p>Título: </p>
            <input type="text" name="titulo">
            <p>Resumo: </p>
            <input type="text" name="resumo">
            <p>Conteúdo: </p>
            <input type="text" name="conteudo">
            <p><button type="submit">Enviar</button></p>
        </form>
        
    </div>
</body>
</html>
